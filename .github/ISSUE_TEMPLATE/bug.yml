name: Bug report
description: Something in Loam doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a note with …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Loam version
      description: Settings › Updates shows it.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04 …
    validations:
      required: true
  - type: checkboxes
    id: setup
    attributes:
      label: Your setup
      options:
        - label: Encryption is on
        - label: Sync is on
        - label: AI access (MCP) is on
