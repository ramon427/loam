# Builds the Windows installer and the macOS disk images for a version tag (v1.2.3) and
# publishes them as one GitHub Release. Auto release calls it for every merged pull request;
# pushing a tag by hand runs it too.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The version tag to release, such as v1.2.3.
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # electron-builder uploads its files in parallel, from both builds; with no release yet, each
  # upload would create its own draft.
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match apps/desktop/package.json version $version"
            exit 1
          fi

      - name: Create the draft release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --title "${TAG#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: draft
    runs-on: windows-latest
    # Uploads the installer to the draft release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # Auto release runs from a pull_request_target event, which electron-builder
      # otherwise takes for a pull request build and skips uploading.
      - name: Package and upload to the draft release
        working-directory: apps/desktop
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_FOR_PULL_REQUEST: "true"

  mac:
    needs: draft
    runs-on: macos-latest
    # Uploads the disk images and update zips to the draft release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # Signed ad hoc (see electron-builder.yml), which needs no certificate or secret. A pull
      # request build would skip signing, and Auto release looks like one to electron-builder.
      - name: Package and upload to the draft release
        working-directory: apps/desktop
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_FOR_PULL_REQUEST: "true"
          CSC_FOR_PULL_REQUEST: "true"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # An unsigned app opens as "damaged" on Apple silicon.
      - name: Check both apps are signed
        working-directory: apps/desktop/release
        run: |
          for app in mac*/Loam.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done

  # Published only once every file is up, so installed copies never see a release without its
  # installer.
  publish:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        run: |
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          for file in latest.yml latest-mac.yml; do
            if ! grep -qx "$file" <<<"$assets"; then
              echo "The $TAG draft has no $file, so installed copies could not update from it"
              exit 1
            fi
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
