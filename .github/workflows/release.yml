# Builds the Windows installer for a version tag (v1.2.3) and publishes it as a
# GitHub Release. Auto release calls it for every merged pull request; pushing a
# tag by hand runs it too.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The version tag to release, such as v1.2.3.
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    # Creates the draft release and uploads the installer to it.
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match apps/desktop/package.json version $version"
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      # electron-builder uploads its files in parallel; with no release yet, each
      # upload would create its own draft.
      - name: Create the draft release
        shell: bash
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --title "${TAG#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Auto release runs from a pull_request_target event, which electron-builder
      # otherwise takes for a pull request build and skips uploading.
      - name: Package and upload to a draft release
        working-directory: apps/desktop
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_FOR_PULL_REQUEST: "true"

      # Published only once every file is up, so installed copies never see a
      # release without its installer.
      - name: Publish the release
        shell: bash
        run: |
          if ! gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx latest.yml; then
            echo "The $TAG draft has no latest.yml, so installed copies could not update from it"
            exit 1
          fi
          gh release edit "$TAG" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
