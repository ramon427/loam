# Builds the macOS disk images without releasing them, and keeps them as a workflow artifact for
# a week. It runs for pull requests that change the packaging, and by hand from the Actions tab
# for any branch. Releases build their own copies (release.yml).
name: Mac build

on:
  pull_request:
    paths:
      - apps/desktop/electron-builder.yml
      - apps/desktop/build/**
      - .github/workflows/mac-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # Signed ad hoc (see electron-builder.yml); a pull request build would skip signing.
      - name: Package
        working-directory: apps/desktop
        run: npx electron-builder --mac --publish never
        env:
          CSC_FOR_PULL_REQUEST: "true"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # An unsigned app opens as "damaged" on Apple silicon.
      - name: Check both apps are signed
        working-directory: apps/desktop/release
        run: |
          for app in mac*/Loam.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --display --verbose=2 "$app" 2>&1 | grep -E "^(Identifier|Signature)="
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loam-mac
          path: apps/desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 7
