# Releases every merged pull request: bumps the patch version (unless the pull
# request set an unreleased one), commits and tags it on main, then builds and publishes the
# Windows installer and the macOS disk images through the Release workflow. Pushes made with GITHUB_TOKEN start no other workflows, so
# the version commit doesn't release again.
name: Auto release

on:
  # Runs the workflow from main, never from the pull request, so it may push.
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, in merge order.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      # A version bumped by hand in the pull request is released as it is.
      - name: Bump the patch version unless it is unreleased, commit and tag it
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(node -p "require('./apps/desktop/package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            npm version patch --workspace apps/desktop --no-git-tag-version
            version=$(node -p "require('./apps/desktop/package.json').version")
            git commit -am "Release $version"
          fi
          git tag "v$version"
          git push --atomic origin HEAD:main "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
